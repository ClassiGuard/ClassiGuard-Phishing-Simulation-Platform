# DR Environment (Secondary Server)
# This compose file is intended to run on the secondary DR server.
# It assumes MongoDB data is either synced out-of-band or using a replica set over a VPN.

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-cyphish_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: cyphish
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-cyphish_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - cyphish_dr_mongo_data:/data/db

  cyphish:
    build: .
    image: cyphish:latest
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: cyphish
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-cyphish_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRUST_PROXY: "true"
      DR_MODE: "true"

  worker:
    build: .
    image: cyphish:latest
    restart: unless-stopped
    command: ["node", "worker.js"]
    depends_on:
      - mongodb
      - redis
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: cyphish
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-cyphish_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cyphish_dr_redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - cyphish
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  cyphish_dr_mongo_data:
  cyphish_dr_redis_data:
